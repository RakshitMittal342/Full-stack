<!DOCTYPE html>
<html>
<head>
<title>Student Task Manager</title>
</head>

<body>
<h2>Student Task Manager</h2>
<input type="text" id="taskInput" placeholder="Enter Task Name">
<select id="priority">
<option>Low</option>
<option>Medium</option>
<option>High</option>
</select>
<button onclick="addTask()">Add Task</button>
<br><br>
<button onclick="filterTask('all')">Show All</button>
<button onclick="filterTask('completed')">Completed</button>
<button onclick="filterTask('pending')">Pending</button>
<br><br>
<ul id="taskList"></ul>

<script>
function addTask() {
let taskName = document.getElementById("taskInput").value;
let priority = document.getElementById("priority").value;
if(taskName == "") return;
let li = document.createElement("li");
li.innerHTML =
taskName + " (" + priority + ") " +
"<button onclick='completeTask(this)'>Complete</button> " +
"<button onclick='deleteTask(this)'>Delete</button>";
li.setAttribute("data-status","pending");
document.getElementById("taskList").appendChild(li);
document.getElementById("taskInput").value="";
}

function completeTask(btn){
let li = btn.parentElement;
li.style.textDecoration = "line-through";
li.setAttribute("data-status","completed");
}

function deleteTask(btn){
btn.parentElement.remove();
}

function filterTask(type){
let tasks = document.querySelectorAll("#taskList li");
tasks.forEach(function(task){
if(type=="all")
task.style.display="block";
else if(type=="completed" && task.getAttribute("data-status")=="completed")
task.style.display="block";
else if(type=="pending" && task.getAttribute("data-status")=="pending")
task.style.display="block";
else
task.style.display="none";
});
}
</script>
</body>
</html>
